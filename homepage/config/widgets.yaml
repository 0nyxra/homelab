- greeting:
    text_size: xl
    text: "Lab de Chahd"

- resources:
    label: Raspberry Pi 5
    cpu: true
    memory: true
    disk: /
    cputemp: true
    tempmin: 30
    tempmax: 85
    units: metric
    uptime: true
    expanded: true

- openmeteo:
    label: MAVILLE
    latitude: 00.00    # remplacer par sa latitude
    longitude: -00.00  # remplacer par sa longitude
    timezone: America/Toronto
    units: metric

- datetime:
    text_size: md
    locale: fr
    format:
      dateStyle: long
      timeStyle: short
      hour12: false
