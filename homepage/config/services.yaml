# href : adresse que je clique (domaine)
# url / siteMonitor : adresse utilisée par Homepage à l'interne (nom du conteneur, réseau proxy)
# Les clés API sont dans les variables HOMEPAGE_VAR_* de la stack, jamais dans ce fichier.

- Réseau:
    - Pi-hole:
        icon: pi-hole.svg
        href: https://pihole.MONDOMAINE.duckdns.org/admin
        description: DNS local · blocage des pubs
        # siteMonitor ne marche pas avec le serveur web de Pi-hole v6 (voir journal de bord)
        ping: 192.168.40.46
        widget:
          type: pihole
          url: http://pihole:80
          version: 6
          key: "{{HOMEPAGE_VAR_PIHOLE_KEY}}"

    - Nginx Proxy Manager:
        icon: nginx-proxy-manager.svg
        description: Reverse proxy · certificats Let's Encrypt
        # Admin liée à 127.0.0.1:81 : accessible seulement par tunnel SSH, donc pas de lien
        siteMonitor: http://nginx-proxy-manager:81

    - Tailscale:
        icon: si-tailscale
        href: https://login.tailscale.com/admin/machines
        description: Route de sous-réseau · split DNS · exit node
        widget:
          type: tailscale
          deviceid: "{{HOMEPAGE_VAR_TS_DEVICE}}"
          key: "{{HOMEPAGE_VAR_TS_KEY}}"

- Supervision:
    - Uptime Kuma:
        icon: uptime-kuma.svg
        href: https://kuma.MONDOMAINE.duckdns.org
        description: Sondes HTTP et DNS · alertes courriel
        siteMonitor: http://uptime-kuma:3001
        widget:
          type: uptimekuma
          url: http://uptime-kuma:3001
          slug: lab

    - healthchecks.io:
        icon: healthchecks.svg
        href: https://healthchecks.io/
        description: Alerte externe si la maison tombe
        widget:
          type: healthchecks
          url: https://healthchecks.io
          key: "{{HOMEPAGE_VAR_HC_KEY}}"
          uuid: "{{HOMEPAGE_VAR_HC_UUID}}"

- Gestion:
    - Portainer:
        icon: si-portainer
        href: https://portainer.MONDOMAINE.duckdns.org
        description: Conteneurs Docker
        siteMonitor: http://portainer:9000
        widget:
          type: portainer
          url: http://portainer:9000
          env: 3
          key: "{{HOMEPAGE_VAR_PORTAINER_KEY}}"
